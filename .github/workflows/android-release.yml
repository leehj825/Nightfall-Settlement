# Builds a Play-Store-ready release bundle (.aab) and a release APK. Manual only: Actions -> "Android release" -> Run workflow.
# Signing needs four repository secrets (see RELEASE.md). Without them the build still runs but produces UNSIGNED output.
name: Android release
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown to players (e.g. 1.0.1)'
        default: '1.0'
      version_code:
        description: 'Integer that must increase with every Play Store upload'
        default: '1'
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Decode the signing keystore (only if the secret exists)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - the output will be unsigned"
          fi
      - run: npm ci
      - run: npm run www && npx cap sync android
      - name: Build AAB and APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nightfall-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
