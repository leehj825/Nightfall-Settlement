# Builds an installable Android *debug* APK of Nightfall Settlement.
# Run it from GitHub: Actions -> "Android debug APK" -> Run workflow. When it finishes, open the run and download the
# "nightfall-debug-apk" artifact (a zip containing app-debug.apk). It also runs automatically for tags like v1.0.0.
name: Android debug APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install web dependencies
        run: npm ci
      - name: Copy the game into the Android project
        run: npm run www && npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nightfall-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
