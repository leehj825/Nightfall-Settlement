<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nightfall Settlement</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1d3a; touch-action: none;
    -webkit-user-select: none; user-select: none; font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #title { position: fixed; top: 10px; left: 0; right: 0; text-align: center; margin: 0; pointer-events: none;
    font-size: clamp(20px, 5vw, 40px); font-weight: 900; letter-spacing: .08em; text-transform: uppercase;
    background: linear-gradient(180deg, #ffe7a8, #ff9d3c 60%, #c2410c); -webkit-background-clip: text; background-clip: text;
    color: transparent; filter: drop-shadow(0 3px 0 #3a1408) drop-shadow(0 0 14px rgba(255,140,50,.5)); }

  #hud { position: fixed; top: 10px; left: 10px; padding: 8px 14px; border-radius: 10px; color: #fff;
    background: rgba(20,10,30,.55); font-size: 17px; line-height: 1.6; pointer-events: none; }
  #clock { position: fixed; top: 58px; left: 0; right: 0; text-align: center; color: #fff; font-size: 18px; font-weight: 700;
    text-shadow: 0 2px 4px #000; pointer-events: none; letter-spacing: .05em; }
  #gameover { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.78); z-index: 20; padding: 16px; }
  #gameover .card { text-align: center; color: #fff; background: rgba(30,12,12,.85); border: 2px solid #8a2a20; border-radius: 18px;
    padding: 28px 34px; max-width: 460px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  #gameover h2 { margin: 0 0 14px; color: #ff5a4a; font-size: clamp(24px, 6vw, 38px); text-shadow: 0 3px 0 #300; }
  #gameover p { margin: 6px 0; font-size: 20px; }
  #gameover p.cause { font-size: 14px; color: #c9a6a0; }
  #restartBtn { margin-top: 18px; font: inherit; font-size: 20px; font-weight: 700; color: #3a1408; padding: 12px 38px; border: 0;
    border-radius: 999px; cursor: pointer; background: linear-gradient(#ffd27a, #ff9a3c); box-shadow: 0 4px 0 #a8480f; }
  #restartBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a8480f; }
  #warn { position: fixed; top: 32%; left: 0; right: 0; text-align: center; color: #ff3b30; z-index: 15; padding: 0 12px;
    font-size: clamp(26px, 6.5vw, 60px); font-weight: 900; text-shadow: 0 4px 0 #3a0000, 0 0 24px rgba(255,40,20,.7);
    opacity: 0; transition: opacity .4s; pointer-events: none; }
  #warn.show { opacity: 1; }
  #toast { position: fixed; top: 22%; left: 0; right: 0; text-align: center; color: #ffe7a8; font-size: 18px;
    text-shadow: 0 2px 4px #000; opacity: 0; transition: opacity .3s; pointer-events: none; }

  #joy { position: fixed; left: 18px; bottom: 18px; width: 150px; height: 150px; z-index: 5; touch-action: none; }

  #actions { position: fixed; right: 18px; bottom: 22px; display: flex; flex-direction: column; gap: 10px; z-index: 5; }
  .btn { font: inherit; font-weight: 700; font-size: 16px; color: #3a1408; width: 80px; height: 80px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.6); background: radial-gradient(circle at 35% 30%, #ffd98a, #ff9a3c);
    box-shadow: 0 4px 0 #a8480f, 0 8px 18px rgba(0,0,0,.4); cursor: pointer; touch-action: none; }
  .btn small { display: block; font-weight: 400; font-size: 11px; opacity: .75; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a8480f; }
  #atkBtn { background: radial-gradient(circle at 35% 30%, #ff8a7a, #c0261a); color: #fff; }
  #upgBtn { position: fixed; top: 10px; right: 10px; z-index: 5; font: inherit; font-weight: 700; font-size: 15px; color: #fff;
    padding: 8px 14px; border-radius: 12px; border: 2px solid rgba(255,255,255,.6); cursor: pointer; touch-action: none;
    background: linear-gradient(#5aa8ff, #2a5fc0); box-shadow: 0 3px 0 #173a80; line-height: 1.2; }
  #upgBtn small { display: block; font-weight: 400; font-size: 11px; opacity: .85; }
  #upgBtn:active { transform: translateY(2px); }
  #upgBtn.done { background: #666; box-shadow: none; opacity: .75; }
  #buildBtn { background: radial-gradient(circle at 35% 30%, #d9b48a, #8a5a34); color: #fff; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<h1 id="title">Nightfall Settlement</h1>
<div id="hud">🌲 나무: <b id="woodN">0</b><br>🪨 돌: <b id="stoneN">0</b><br>❤️ HP: <b id="hpN">100</b><br>⚔️ 공격력: <b id="atkN">1</b></div>
<button id="upgBtn">무기 강화<small>돌 10개 소모</small></button>
<div id="clock">Day 1 - 08:00</div>
<div id="warn"></div>
<div id="gameover"><div class="card"><h2>당신의 마을은 무너졌습니다.</h2><p id="goDays"></p><p class="cause" id="goCause"></p><button id="restartBtn">다시 시작</button></div></div>
<div id="toast"></div>
<canvas id="joy" width="150" height="150"></canvas>
<div id="actions">
  <button class="btn" id="atkBtn">공격<small>Attack · F</small></button>
  <button class="btn" id="buildBtn"><span id="buildLbl">청사진 배치</span><small>Build · B / U</small></button>
  <button class="btn" id="actBtn">채집<small>Action · Space</small></button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ---------- 렌더러 / 씬 ----------
  const canvas = document.getElementById('game');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const dusk = new THREE.Color(0x3a2a52);
  scene.background = dusk;
  scene.fog = new THREE.Fog(dusk, 35, 80);

  // ---------- 조명 ----------
  const ambient = new THREE.AmbientLight(0x6f86d6, 0.6);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xff9a4a, 1.2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 90 });
  scene.add(sun, sun.target);

  // ---------- 바닥 ----------
  const MAP = 50;   // 맵 반경
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(MAP * 2 + 40, MAP * 2 + 40),
    new THREE.MeshStandardMaterial({ color: 0x9a6b44, flatShading: true, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // ---------- 밸런스 설정 (여기서 조절) ----------
  const CFG = {
    TREE_COUNT: 26, STONE_COUNT: 26,           // 맵에 생성되는 나무 / 바위 수
    GATHER_YIELD: { wood: 1, stone: 1 },       // 1회 채집당 획득량 (플레이어·동료 공통)
    FENCE_BUILD_WOOD: 5,                       // 목책 건설 비용(나무, 동료가 건설 시 차감)
    BUILD_TIME: 2, REPAIR_TIME: 1.5, GATHER_TIME: 2,   // 동료의 작업 시간(초)
    FENCE_UPGRADE_STONE: 5,                    // 돌 성벽 업그레이드 비용(돌)
    FENCE_HP: 30, WALL_HP: 100,                // 나무 목책 / 돌 성벽 체력
    // 구조물 파괴력 (초당 데미지): 적 종류 x 구조물 종류 로 분리
    STRUCT_DPS: { normal: { wood: 10, stone: 10 }, brute: { wood: 20, stone: 35 } },
    RESPAWN_HOUR: 6,                           // 매일 이 시각에 부족한 자원 리스폰
    // 웨이브 / 난이도: 밤마다 총 마릿수 = WAVE_BASE + Day * WAVE_PER_DAY
    WAVE_BASE: 3, WAVE_PER_DAY: 2,
    SPAWN_INTERVAL_BASE: 6, SPAWN_RATE_GROWTH: 0.3, MIN_SPAWN_INTERVAL: 0.6,   // 간격 = BASE / (1 + GROWTH*(Day-1))
    MAX_ALIVE: 30,                             // 동시에 존재할 수 있는 적 수
    // 브루트 (Day 2부터, 웨이브 마지막에 등장)
    BRUTE_FROM_DAY: 2, BRUTE_HP: 10, BRUTE_SCALE: 1.5, BRUTE_SPEED_MUL: 0.7, BRUTE_CONTACT_DMG: 25, ENEMY_CONTACT_DMG: 10,
    KNOCKBACK: 0.7, KNOCKBACK_UPGRADED: 1.6, BRUTE_KNOCKBACK_MUL: 0.7,   // 넉백 거리 (무기 강화 시 증가)
    ENEMY_HP: 2,                               // 적 체력
    BASE_ATK: 1, UPGRADED_ATK: 2,              // 공격력 (플레이어·동료 공통)
    WEAPON_UPGRADE_STONE: 10,                  // 무기 강화 비용(돌)
    UPGRADED_SLASH_SCALE: 1.5,                 // 강화 후 검기 크기 배율
  };

  // ---------- 절차적 맵: 나무 / 바위 ----------
  const obstacles = [];   // 충돌 + 채집 대상 배열
  const mat = (c) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 1 });
  const trunkMat = mat(0x6b4226), leafMat = mat(0x3f8a3c), rockMat = mat(0x8b8b92);
  const rand = (a, b) => a + Math.random() * (b - a);

  function makeTree() {
    const g = new THREE.Group();
    const h = rand(1.2, 1.8);
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.32, h, 6), trunkMat);
    trunk.position.y = h / 2;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(rand(1.0, 1.3), rand(2.2, 3), 6), leafMat);
    cone.position.y = h + 0.9;
    g.add(trunk, cone);
    g.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
    g.userData = { type: 'wood', radius: 0.9 };
    return g;
  }
  function makeRock() {
    const s = rand(0.6, 1.2);
    const m = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
    m.scale.y = rand(0.7, 1);
    m.position.y = s * 0.55;
    m.rotation.set(rand(0, 3), rand(0, 3), rand(0, 3));
    m.castShadow = m.receiveShadow = true;
    const g = new THREE.Group();
    g.add(m);
    g.userData = { type: 'stone', radius: s * 0.95 };
    return g;
  }
  function scatter(factory, count, ok = () => true) {
    for (let i = 0; i < count; i++) {
      const o = factory();
      for (let tries = 0; tries < 60; tries++) {
        const x = rand(-MAP + 3, MAP - 3), z = rand(-MAP + 3, MAP - 3);
        if (Math.hypot(x, z) < 5 || !ok(x, z)) continue;   // 시작 지점 비우기
        if (obstacles.some(p => Math.hypot(p.position.x - x, p.position.z - z) < p.userData.radius + o.userData.radius + 0.8)) continue;
        o.position.set(x, 0, z);
        o.rotation.y = rand(0, Math.PI * 2);
        scene.add(o);
        obstacles.push(o);
        break;
      }
    }
  }
  scatter(makeTree, CFG.TREE_COUNT);
  scatter(makeRock, CFG.STONE_COUNT);

  // ---------- 플레이어 ----------
  const player = new THREE.Group();
  const R = 0.45, H = 0.7;
  const bodyMat = mat(0xe8553c);
  const capsule = new THREE.Group();
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(R, R, H, 10), bodyMat);
  const capTop = new THREE.Mesh(new THREE.SphereGeometry(R, 10, 6), bodyMat);
  const capBot = capTop.clone();
  capTop.position.y = H / 2; capBot.position.y = -H / 2;
  capsule.add(cyl, capTop, capBot);
  capsule.position.y = H / 2 + R;
  const face = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.2), mat(0xfff1c9));   // 얼굴(앞쪽 +Z)
  face.position.set(0, 0.5, R * 0.95);
  capsule.add(face);
  capsule.traverse(m => { if (m.isMesh) m.castShadow = true; });
  player.add(capsule);
  scene.add(player);
  const PLAYER_R = 0.5;

  // ---------- 카메라 (Orbit + Lerp) ----------
  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 200);
  let yaw = 0, pitch = 0.45;
  const DIST = 8, LOOK_H = 1.6;
  const camGoal = new THREE.Vector3(), lookAt = new THREE.Vector3();
  function goalPos(out) {
    return out.set(
      player.position.x + Math.sin(yaw) * Math.cos(pitch) * DIST,
      LOOK_H + Math.sin(pitch) * DIST,
      player.position.z + Math.cos(yaw) * Math.cos(pitch) * DIST);
  }
  camera.position.copy(goalPos(camGoal));
  lookAt.set(0, LOOK_H, 0);

  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  // ---------- 카메라 회전 입력 ----------
  // 모바일: 화면 우측 터치 드래그 / PC: 마우스 우클릭 드래그
  const look = { id: null, x: 0, y: 0 };
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointerdown', e => {
    const ok = e.pointerType === 'mouse' ? e.button === 2 : e.clientX > innerWidth * 0.4;
    if (!ok || look.id !== null) return;
    look.id = e.pointerId; look.x = e.clientX; look.y = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (e.pointerId !== look.id) return;
    yaw -= (e.clientX - look.x) * 0.006;
    pitch = Math.min(1.2, Math.max(0.1, pitch + (e.clientY - look.y) * 0.005));
    look.x = e.clientX; look.y = e.clientY;
  });
  const lookEnd = e => { if (e.pointerId === look.id) look.id = null; };
  canvas.addEventListener('pointerup', lookEnd);
  canvas.addEventListener('pointercancel', lookEnd);

  // ---------- 가상 조이스틱 (Canvas) ----------
  const joyCanvas = document.getElementById('joy');
  const jctx = joyCanvas.getContext('2d');
  const joy = { x: 0, y: 0, id: null };   // x: 오른쪽 +, y: 위쪽 +
  const JC = 75, JMAX = 50;
  function drawJoy() {
    jctx.clearRect(0, 0, 150, 150);
    jctx.beginPath(); jctx.arc(JC, JC, JMAX + 10, 0, 7);
    jctx.fillStyle = 'rgba(255,255,255,.12)'; jctx.fill();
    jctx.lineWidth = 3; jctx.strokeStyle = 'rgba(255,255,255,.4)'; jctx.stroke();
    jctx.beginPath(); jctx.arc(JC + joy.x * JMAX, JC - joy.y * JMAX, 28, 0, 7);
    jctx.fillStyle = 'rgba(255,190,110,.8)'; jctx.fill();
    jctx.strokeStyle = 'rgba(255,255,255,.8)'; jctx.stroke();
  }
  function joyUpdate(e) {
    const r = joyCanvas.getBoundingClientRect();
    let dx = e.clientX - r.left - JC, dy = e.clientY - r.top - JC;
    const l = Math.hypot(dx, dy);
    if (l > JMAX) { dx = dx / l * JMAX; dy = dy / l * JMAX; }
    joy.x = dx / JMAX; joy.y = -dy / JMAX;
    drawJoy();
  }
  const joyEnd = e => { if (e.pointerId !== joy.id) return; joy.id = null; joy.x = joy.y = 0; drawJoy(); };
  joyCanvas.addEventListener('pointerdown', e => {
    if (joy.id !== null) return;
    joy.id = e.pointerId; joyCanvas.setPointerCapture(e.pointerId); joyUpdate(e);
  });
  joyCanvas.addEventListener('pointermove', e => { if (e.pointerId === joy.id) joyUpdate(e); });
  joyCanvas.addEventListener('pointerup', joyEnd);
  joyCanvas.addEventListener('pointercancel', joyEnd);
  drawJoy();

  // ---------- 키보드 ----------
  const keys = {};
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) gather(); }
    if (e.code === 'KeyB' && !e.repeat) build();
    if (e.code === 'KeyU' && !e.repeat) upgradeFence();
    if (e.code === 'KeyF' && !e.repeat) attack();
    keys[e.code] = true;
  });
  addEventListener('keyup', e => { keys[e.code] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  // ---------- 자원 / 상호작용 ----------
  const res = { wood: 0, stone: 0 };
  let weaponUp = false, atk = CFG.BASE_ATK;
  const woodEl = document.getElementById('woodN'), stoneEl = document.getElementById('stoneN');
  const toastEl = document.getElementById('toast');
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.style.opacity = 1;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.style.opacity = 0, 1400);
  }
  const atkEl = document.getElementById('atkN');
  function updateHud() { woodEl.textContent = res.wood; stoneEl.textContent = res.stone; atkEl.textContent = atk; }

  const GATHER_RANGE = 2.6;
  function gather() {
    if (dead) return;
    let best = null, bestD = GATHER_RANGE;
    for (const o of obstacles) {
      if (o.userData.type !== 'wood' && o.userData.type !== 'stone') continue;
      const d = Math.hypot(o.position.x - player.position.x, o.position.z - player.position.z) - o.userData.radius;
      if (d < bestD) { bestD = d; best = o; }
    }
    if (!best) return toast('가까이에 채집할 대상이 없습니다');
    scene.remove(best);
    obstacles.splice(obstacles.indexOf(best), 1);
    res[best.userData.type] += CFG.GATHER_YIELD[best.userData.type];
    updateHud();
  }

  const fenceMat = mat(0x8a5a34), wallMat = mat(0x4a4d52);
  const UPGRADE_RANGE = 3.2;
  function nearestFence(level) {
    let best = null, bd = UPGRADE_RANGE;
    for (const o of obstacles) {
      if (o.userData.type !== 'fence' || (level && o.userData.level !== level)) continue;
      const d = Math.hypot(o.position.x - player.position.x, o.position.z - player.position.z);
      if (d < bd) { bd = d; best = o; }
    }
    return best;
  }
  // 청사진: 충돌 판정이 없고(obstacles에 넣지 않음) 적도 무시하는 반투명 목책. 동료 NPC가 실물로 건설한다.
  const blueprints = [];
  const bpGeo = new THREE.BoxGeometry(2.4, 1.1, 0.35);
  function createFence(x, z, rot) {
    const fence = new THREE.Mesh(bpGeo, fenceMat);
    fence.position.set(x, 0.55, z);
    fence.rotation.y = rot;
    fence.castShadow = fence.receiveShadow = true;
    fence.userData = { type: 'fence', level: 'wood', radius: 1.0, hp: CFG.FENCE_HP, maxHp: CFG.FENCE_HP };
    scene.add(fence);
    obstacles.push(fence);
    return fence;
  }
  function build() {
    if (dead) return;
    const fx = Math.sin(facing), fz = Math.cos(facing);
    const x = player.position.x + fx * 2, z = player.position.z + fz * 2;
    const taken = blueprints.concat(obstacles.filter(o => o.userData.type === 'fence'));
    if (taken.some(o => Math.hypot(o.position.x - x, o.position.z - z) < 1.6)) return toast('이미 그 위치에 목책이 있습니다');
    const bp = new THREE.Mesh(bpGeo, new THREE.MeshBasicMaterial({ color: 0x4aa8ff, transparent: true, opacity: 0.4, depthWrite: false }));
    bp.position.set(x, 0.55, z);
    bp.rotation.y = facing;
    bp.userData = { type: 'blueprint', radius: 1.0 };
    scene.add(bp);
    blueprints.push(bp);
    toast(`청사진 배치! 동료가 나무 ${CFG.FENCE_BUILD_WOOD}개로 건설합니다`);
  }
  function upgradeFence() {
    if (dead) return;
    const f = nearestFence('wood');
    if (!f) return toast(nearestFence() ? '이미 돌 성벽입니다' : '가까이에 업그레이드할 나무 목책이 없습니다');
    if (res.stone < CFG.FENCE_UPGRADE_STONE) return toast(`돌이 ${CFG.FENCE_UPGRADE_STONE}개 필요합니다`);
    res.stone -= CFG.FENCE_UPGRADE_STONE;
    f.material = wallMat;                         // 짙은 회색 돌 성벽
    f.scale.y = 1.25; f.position.y = 0.55 * 1.25;
    Object.assign(f.userData, { level: 'stone', hp: CFG.WALL_HP, maxHp: CFG.WALL_HP });
    updateHud();
    toast('돌 성벽으로 업그레이드!');
  }
  // 버튼: 가까이에 나무 목책이 있으면 업그레이드, 아니면 건설
  function buildOrUpgrade() { if (nearestFence('wood')) upgradeFence(); else build(); }

  function upgradeWeapon() {
    if (dead) return;
    if (weaponUp) return toast('이미 무기가 강화되었습니다');
    if (res.stone < CFG.WEAPON_UPGRADE_STONE) return toast(`돌이 ${CFG.WEAPON_UPGRADE_STONE}개 필요합니다`);
    res.stone -= CFG.WEAPON_UPGRADE_STONE;
    weaponUp = true; atk = CFG.UPGRADED_ATK;
    updateHud();
    const btn = document.getElementById('upgBtn');
    btn.classList.add('done'); btn.firstChild.textContent = '무기 강화 완료'; btn.lastChild.textContent = `공격력 ${atk}`;

  }
  const bindBtn = (id, fn) => document.getElementById(id).addEventListener('pointerdown', e => { e.preventDefault(); fn(); });
  bindBtn('actBtn', gather);
  bindBtn('buildBtn', buildOrUpgrade);
  bindBtn('upgBtn', upgradeWeapon);
  bindBtn('atkBtn', attack);

  // ---------- 낮/밤 순환 ----------
  const DAY_START_MIN = 8 * 60;       // 08:00 시작
  const MIN_PER_SEC = 10;             // 현실 1초 = 게임 10분
  const clockEl = document.getElementById('clock');
  let gameMin = DAY_START_MIN;
  const C = (h) => new THREE.Color(h);
  const L = {
    sunDay: C(0xff9a4a), sunNight: C(0x3a4a9a),
    ambDay: C(0x6f86d6), ambNight: C(0x1a2450),
    fogDay: C(0x3a2a52), fogNight: C(0x0a0d1c),
  };
  const lerp = THREE.MathUtils.lerp;
  // 0 = 낮, 1 = 한밤. 18시부터 서서히 어두워지고 05~07시에 다시 밝아짐
  function nightFactor(h) {
    if (h >= 18 && h < 21) return (h - 18) / 3;
    if (h >= 21 || h < 5) return 1;
    if (h < 7) return 1 - (h - 5) / 2;
    return 0;
  }
  function applyLighting(n) {
    sun.color.copy(L.sunDay).lerp(L.sunNight, n);
    sun.intensity = lerp(1.2, 0.18, n);
    ambient.color.copy(L.ambDay).lerp(L.ambNight, n);
    ambient.intensity = lerp(0.6, 0.28, n);
    scene.fog.color.copy(L.fogDay).lerp(L.fogNight, n);
    scene.background.copy(scene.fog.color);
    scene.fog.near = lerp(35, 6, n);
    scene.fog.far = lerp(80, 30, n);
  }

  // ---------- 플레이어 횃불 ----------

  // ---------- 모닥불 (마을 거점) ----------
  const FIRE_R = 0.8;
  const campfire = new THREE.Group();

  for (let i = 0; i < 4; i++) {
    const log = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.22, 0.22), logMat);
    log.position.y = 0.2;

  // ---------- 체력 / 게임오버 ----------

  // ---------- 이펙트: 타격 궤적 / 파편 ----------
  const ATK_RANGE = 3, ATK_HALF = Math.PI / 3, ATK_CD = 0.4, SLASH_LIFE = 0.15;
  const slashGeo = new THREE.CircleGeometry(ATK_RANGE, 20, -Math.PI / 2 - ATK_HALF, ATK_HALF * 2);
  const slashes = [];
  const slashScale = () => weaponUp ? CFG.UPGRADED_SLASH_SCALE : 1;
  function spawnSlash(x, z, ang) {
    const g = new THREE.Group();
    const m = new THREE.Mesh(slashGeo, new THREE.MeshBasicMaterial({
      color: weaponUp ? 0x4aa8ff : 0xffffff, transparent: true, opacity: 0.6, depthWrite: false, side: THREE.DoubleSide }));
    m.rotation.x = -Math.PI / 2;

  }
  const particles = [];
  const pGeo = new THREE.BoxGeometry(0.18, 0.18, 0.18);
  const pMat = new THREE.MeshBasicMaterial({ color: 0xff2a1a });
  const PLIFE = 0.7;
  function burst(pos, count = 12) {
    for (let i = 0; i < count; i++) {
      const m = new THREE.Mesh(pGeo, pMat);
      m.position.set(pos.x, 0.8, pos.z);
      m.userData = { v: new THREE.Vector3(rand(-1, 1) * 4, rand(3, 6), rand(-1, 1) * 4), life: PLIFE };
      scene.add(m);
      particles.push(m);
    }
  }
  const dustMat = new THREE.MeshBasicMaterial({ color: 0xc8b090 });
  function dust(x, z) {                       // 건설 완료 먼지 파티클
    for (let i = 0; i < 16; i++) {
      const m = new THREE.Mesh(pGeo, dustMat);
      m.position.set(x + rand(-1, 1), 0.2, z + rand(-0.3, 0.3));
      m.userData = { v: new THREE.Vector3(rand(-1, 1) * 2.2, rand(1, 2.6), rand(-1, 1) * 2.2), life: PLIFE };
      scene.add(m);
      particles.push(m);
    }
  }
  function updateFx(dt) {
    for (const s of slashes.slice()) {
      s.userData.life -= dt;
      s.children[0].material.opacity = Math.max(0, s.userData.life / SLASH_LIFE) * 0.6;
      if (s.userData.life <= 0) { scene.remove(s); s.children[0].material.dispose(); slashes.splice(slashes.indexOf(s), 1); }
    }
    for (const p of particles.slice()) {
      const u = p.userData;
      u.v.y -= 14 * dt;
      p.position.addScaledVector(u.v, dt);
      if (p.position.y < 0.1) { p.position.y = 0.1; u.v.y *= -0.3; u.v.x *= 0.6; u.v.z *= 0.6; }
      p.rotation.x += dt * 8; p.rotation.z += dt * 6;
      u.life -= dt;
      p.scale.setScalar(Math.max(u.life / PLIFE, 0.01));
      if (u.life <= 0) { scene.remove(p); particles.splice(particles.indexOf(p), 1); }
    }
  }

  // ---------- 적 (약탈자) ----------
  const enemies = [];
  const enemyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.6, 8);
  const enemyMat = mat(0xc4231a), bruteMat = mat(0x5a0d0a);
  const ENEMY_R = 0.45, ENEMY_SPEED = 2.4;
  const AGGRO = 9, DEAGGRO = 13, FIRE_BREAK_TIME = 3;
  let spawnCd = 0;
  function spawnEnemy(brute = false) {
    const a = rand(0, Math.PI * 2), r = MAP - 1;    // 맵 외곽 (안개 속 먼 곳)
    const sc = brute ? CFG.BRUTE_SCALE : 1;
    const m = new THREE.Mesh(enemyGeo, brute ? bruteMat : enemyMat);
    m.scale.setScalar(sc);
    m.position.set(Math.cos(a) * r, 0.8 * sc, Math.sin(a) * r);
    m.castShadow = true;
    m.userData = {
      brute, hp: brute ? CFG.BRUTE_HP : CFG.ENEMY_HP, r: ENEMY_R * sc,
      speed: ENEMY_SPEED * (brute ? CFG.BRUTE_SPEED_MUL : 1),
      contact: brute ? CFG.BRUTE_CONTACT_DMG : CFG.ENEMY_CONTACT_DMG,
      kbMul: brute ? CFG.BRUTE_KNOCKBACK_MUL : 1, kbT: 0, kbVx: 0, kbVz: 0,
      fireTimer: 0, aggro: false, sinking: false };
    scene.add(m);
    enemies.push(m);
  }
  function removeEnemy(e) { scene.remove(e); enemies.splice(enemies.indexOf(e), 1); }
  function killEnemy(e) { burst(e.position); removeEnemy(e); }

  // 적에게 피해: 죽으면 true, 살아남으면 작은 파편 + 넉백 (무기 강화 시 더 멀리)
  const KB_TIME = 0.15;
  function hitEnemy(e, dmg, fromX, fromZ) {
    const u = e.userData;
    u.hp -= dmg;
    if (u.hp <= 0) { killEnemy(e); return true; }
    burst(e.position, 4);
    const dx = e.position.x - fromX, dz = e.position.z - fromZ, d = Math.hypot(dx, dz) || 1;
    const dist = (weaponUp ? CFG.KNOCKBACK_UPGRADED : CFG.KNOCKBACK) * u.kbMul;
    u.kbT = KB_TIME; u.kbVx = dx / d * dist / KB_TIME; u.kbVz = dz / d * dist / KB_TIME;
    return false;
  }

  // 부채꼴 판정: (x,z)에서 ang 방향, 공격력(atk)만큼 피해 (플레이어·동료 공통)
  function sectorHit(x, z, ang) {
    const fx = Math.sin(ang), fz = Math.cos(ang);
    const range = ATK_RANGE * slashScale();
    let n = 0;
    for (const e of enemies.slice()) {
      if (e.userData.sinking) continue;
      const dx = e.position.x - x, dz = e.position.z - z;
      const d = Math.hypot(dx, dz);
      if (d > range + e.userData.r) continue;
      if (d < 0.9 || (dx * fx + dz * fz) / d > Math.cos(ATK_HALF)) { hitEnemy(e, atk, x, z); n++; }
    }
    return n;
  }

  // 웨이브: 밤이 시작될 때 그날의 총 마릿수를 정하고 순차적으로 스폰. 브루트는 웨이브 마지막에 등장
  const wave = { day: 0, remaining: 0, brutes: 0 };
  function startWave(day) {
    wave.day = day;
    wave.remaining = CFG.WAVE_BASE + day * CFG.WAVE_PER_DAY;
    wave.brutes = day >= CFG.BRUTE_FROM_DAY ? 1 + Math.floor((day - CFG.BRUTE_FROM_DAY) / 3) : 0;
    spawnCd = 0;
  }
  function updateEnemies(dt, night, waveDay) {
    if (night && wave.day !== waveDay) startWave(waveDay);
    if (night && !dead && wave.remaining > 0) {
      spawnCd -= dt;
      if (spawnCd <= 0 && enemies.length < CFG.MAX_ALIVE) {
        spawnEnemy(wave.remaining <= wave.brutes);
        wave.remaining--;
        spawnCd = rand(0.8, 1.2) * Math.max(CFG.MIN_SPAWN_INTERVAL, CFG.SPAWN_INTERVAL_BASE / (1 + CFG.SPAWN_RATE_GROWTH * (waveDay - 1)));
      }
    }
    for (const e of enemies.slice()) {
      const u = e.userData, er = u.r;
      if (!night && !u.sinking) u.sinking = true;          // 아침: 땅으로 꺼짐
      if (u.sinking) {
        e.position.y -= dt * 0.8;
        if (e.position.y < -1.0) removeEnemy(e);
        continue;
      }
      if (dead) continue;

      // 기본 목표는 모닥불, 플레이어가 인식 거리 안이면 플레이어를 추적 (Aggro)
      const pd = Math.hypot(player.position.x - e.position.x, player.position.z - e.position.z);
      u.aggro = u.aggro ? pd < DEAGGRO : pd < AGGRO;
      const tx = u.aggro ? player.position.x : 0, tz = u.aggro ? player.position.z : 0;
      e.lookAt(tx, e.position.y, tz);
      const dx = tx - e.position.x, dz = tz - e.position.z;
      const d = Math.hypot(dx, dz);
      let blocked = null;
      if (u.kbT > 0) {                       // 넉백 중에는 밀려남
        u.kbT -= dt;
        e.position.x += u.kbVx * dt; e.position.z += u.kbVz * dt;
      } else if (d > 0.8) {
        e.position.x += dx / d * u.speed * dt;
        e.position.z += dz / d * u.speed * dt;
      }
      // 장애물 충돌: 목책이면 멈추고 공격, 나머지는 비켜 감
      for (const o of obstacles) {
        const ox = e.position.x - o.position.x, oz = e.position.z - o.position.z;
        const min = o.userData.radius + er, od = Math.hypot(ox, oz);
        if (od < min && od > 1e-4) {
          e.position.x = o.position.x + ox / od * min;
          e.position.z = o.position.z + oz / od * min;
          if (o.userData.type === 'fence') blocked = o;
        }
      }
      if (blocked) {
        e.position.x += (Math.random() - .5) * 0.02;
        blocked.userData.hp -= CFG.STRUCT_DPS[u.brute ? 'brute' : 'normal'][blocked.userData.level === 'stone' ? 'stone' : 'wood'] * dt;   // 구조물 체력 감소
        if (blocked.userData.hp <= 0) {
          scene.remove(blocked);
          obstacles.splice(obstacles.indexOf(blocked), 1);
        }
      }

      // 모닥불 공격: 도달 후 3초 유지되면 모닥불 소멸 → 패배
      if (fireAlive && Math.hypot(e.position.x, e.position.z) < FIRE_R + er + 0.3) {
        u.fireTimer += dt;
        flame.scale.multiplyScalar(0.98);
        if (u.fireTimer >= FIRE_BREAK_TIME) destroyFire();
      } else u.fireTimer = 0;

      // 플레이어 / 동료와 접촉 시 피해
      if (pd < PLAYER_R + er + 0.15 && hurtCd <= 0) { damage(u.contact); hurtCd = 0.8; shake = Math.max(shake, 0.15); }
      if (!npc.down && npc.hurtCd <= 0 &&
          Math.hypot(npc.position.x - e.position.x, npc.position.z - e.position.z) < PLAYER_R + er) {
        damageNpc(u.contact); npc.hurtCd = 0.8;
      }
    }
    hurtCd -= dt;
    npc.hurtCd -= dt;
  }

  // ---------- 동료 NPC ----------
  const NPC_MAX_HP = 50, NPC_AGGRO = 10, NPC_HOME = { x: 2.4, z: 2.4 };
  const npcMat = mat(0x3a6fe0);
  const npc = new THREE.Group();
  const npcBody = new THREE.Group();
  {
    const c = new THREE.Mesh(new THREE.CylinderGeometry(R, R, H, 10), npcMat);
    const t1 = new THREE.Mesh(new THREE.SphereGeometry(R, 10, 6), npcMat);
    const t2 = t1.clone();
    t1.position.y = H / 2; t2.position.y = -H / 2;
    const f = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.2), mat(0xfff1c9));
    f.position.set(0, 0.5, R * 0.95);
    npcBody.add(c, t1, t2, f);
    npcBody.traverse(m => { if (m.isMesh) m.castShadow = true; });
  }
  const NPC_BASE_Y = H / 2 + R;
  npcBody.position.y = NPC_BASE_Y;
  npc.add(npcBody);
  npc.position.set(NPC_HOME.x, 0, NPC_HOME.z);
  Object.assign(npc, { hp: NPC_MAX_HP, down: false, target: null, gatherT: 0, atkCd: 0, hurtCd: 0, returning: false, face: 0, labelText: '', task: null, workT: 0, noWood: false });
  scene.add(npc);

  // 머리 위 상태 라벨
  const labelCanvas = document.createElement('canvas');
  labelCanvas.width = 256; labelCanvas.height = 96;
  const lctx = labelCanvas.getContext('2d');
  const labelTex = new THREE.CanvasTexture(labelCanvas);
  const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: labelTex, transparent: true, fog: false }));
  label.scale.set(2.6, 0.98, 1);
  label.position.y = 2.7;
  npc.add(label);
  function setLabel(state) {
    const text = `${state}|${npc.hp}`;
    if (npc.labelText === text) return;
    npc.labelText = text;
    lctx.clearRect(0, 0, 256, 96);
    lctx.fillStyle = 'rgba(10,10,30,.65)';
    lctx.beginPath(); lctx.roundRect ? lctx.roundRect(8, 8, 240, 80, 16) : lctx.rect(8, 8, 240, 80); lctx.fill();
    lctx.textAlign = 'center'; lctx.fillStyle = '#fff';
    lctx.font = 'bold 34px sans-serif'; lctx.fillText(state, 128, 46);
    lctx.font = '22px sans-serif'; lctx.fillStyle = '#9fd0ff'; lctx.fillText(`HP ${npc.hp}/${NPC_MAX_HP}`, 128, 76);
    labelTex.needsUpdate = true;
  }

  function damageNpc(n) {
    npc.hp = Math.max(0, npc.hp - n);
    if (npc.hp <= 0 && !npc.down) {
      npc.down = true; npc.target = null; npc.gatherT = 0; npc.returning = false; npc.task = null; npc.workT = 0;
      npcMat.color.set(0x777777);                 // 회색으로 변환
      npcBody.rotation.z = Math.PI / 2;           // 바닥에 눕기
      npcBody.position.y = R;
      burst(npc.position);
    }
  }
  function reviveNpc() {
    npc.down = false; npc.hp = NPC_MAX_HP;
    npcMat.color.set(0x3a6fe0);
    npcBody.rotation.z = 0; npcBody.position.y = NPC_BASE_Y;
    npc.position.set(NPC_HOME.x, 0, NPC_HOME.z);
  }
  // 목표 지점으로 이동 (남은 거리 반환)
  function npcMove(tx, tz, speed, dt) {
    const dx = tx - npc.position.x, dz = tz - npc.position.z, d = Math.hypot(dx, dz);
    if (d > 0.05) {
      const step = Math.min(d, speed * dt);
      npc.position.x += dx / d * step; npc.position.z += dz / d * step;
      npc.face = Math.atan2(dx, dz);
      npc.rotation.y = npc.face;
    }
    for (const o of obstacles) {
      const ox = npc.position.x - o.position.x, oz = npc.position.z - o.position.z;
      const min = o.userData.radius + PLAYER_R, od = Math.hypot(ox, oz);
      if (od < min && od > 1e-4) { npc.position.x = o.position.x + ox / od * min; npc.position.z = o.position.z + oz / od * min; }
    }
    return d;
  }
  // 주간 작업 선택
  function nearestOf(list, pred) {
    let best = null, bd = Infinity;
    for (const o of list) {
      if (!pred(o)) continue;
      const d = Math.hypot(o.position.x - npc.position.x, o.position.z - npc.position.z);
      if (d < bd) { bd = d; best = o; }
    }
    return best;
  }
  function pickDayTask() {
    const damaged = nearestOf(obstacles, o => o.userData.type === 'fence' && o.userData.hp < o.userData.maxHp);
    if (damaged) return { kind: 'repair', target: damaged };
    if (npc.noWood && res.wood >= CFG.FENCE_BUILD_WOOD) npc.noWood = false;
    if (!npc.noWood) {
      const bp = nearestOf(blueprints, () => true);
      if (bp) return { kind: 'build', target: bp };
    }
    const r = nearestOf(obstacles, o => npc.noWood ? o.userData.type === 'wood' : (o.userData.type === 'wood' || o.userData.type === 'stone'));
    return r ? { kind: 'gather', target: r } : null;
  }
  function taskValid(tk) {
    if (tk.kind === 'build') return blueprints.includes(tk.target);
    if (!obstacles.includes(tk.target)) return false;
    return tk.kind !== 'repair' || tk.target.userData.hp < tk.target.userData.maxHp;
  }
  function updateNpc(dt, hour, t) {
    if (dead) return;
    const isDay = hour >= 6 && hour < 18;
    if (npc.down) {
      if (isDay) reviveNpc(); else { setLabel('쓰러짐'); return; }
    }
    npc.atkCd -= dt;
    let state = '대기 중';
    let bob = 0;

    if (isDay) {
      // 주간 우선순위: 1) 수리  2) 건설(청사진)  3) 채집
      const PRIO = { repair: 0, build: 1, gather: 2 };
      let task = npc.task;
      if (task && !taskValid(task)) { task = npc.task = null; npc.workT = 0; }
      if (!task || npc.workT === 0) {           // 작업 도중이 아니면 더 높은 우선순위 작업이 있는지 확인
        const nt = pickDayTask();
        if (nt && (!task || PRIO[nt.kind] < PRIO[task.kind])) { task = npc.task = nt; npc.workT = 0; }
        else if (!task) task = npc.task = nt;
      }
      if (task) {
        const o = task.target;
        state = { repair: '수리 중', build: '건설 중', gather: '채집 중' }[task.kind];
        const stop = task.kind === 'build' ? 1.2 : o.userData.radius + PLAYER_R + (task.kind === 'repair' ? 0.4 : 0.3);
        const d = Math.hypot(o.position.x - npc.position.x, o.position.z - npc.position.z);
        if (d > stop) { npcMove(o.position.x, o.position.z, 3.5, dt); npc.workT = 0; }
        else {
          npc.face = Math.atan2(o.position.x - npc.position.x, o.position.z - npc.position.z);
          npc.rotation.y = npc.face;
          if (task.kind === 'build' && npc.workT === 0 && res.wood < CFG.FENCE_BUILD_WOOD) {
            // 도착했는데 나무가 부족하면 건설 보류, 즉시 채집으로 전환
            npc.noWood = true; npc.task = null;
            toast('나무가 부족해 건설을 보류하고 채집합니다');
          } else {
            npc.workT += dt;
            bob = Math.abs(Math.sin(t * 14)) * 0.15;       // 들썩임
            if (task.kind === 'build' && npc.workT >= CFG.BUILD_TIME) {
              if (res.wood >= CFG.FENCE_BUILD_WOOD) {
                res.wood -= CFG.FENCE_BUILD_WOOD; updateHud();
                blueprints.splice(blueprints.indexOf(o), 1); scene.remove(o);
                createFence(o.position.x, o.position.z, o.rotation.y);
                dust(o.position.x, o.position.z);
              }
              npc.task = null; npc.workT = 0;
            } else if (task.kind === 'repair' && npc.workT >= CFG.REPAIR_TIME) {
              o.userData.hp = o.userData.maxHp;
              dust(o.position.x, o.position.z);
              npc.task = null; npc.workT = 0;
            } else if (task.kind === 'gather' && npc.workT >= CFG.GATHER_TIME) {
              const type = o.userData.type;
              scene.remove(o); obstacles.splice(obstacles.indexOf(o), 1);
              res[type] += CFG.GATHER_YIELD[type]; updateHud();
              npc.task = null; npc.workT = 0;
            }
          }
        }
      } else npcMove(NPC_HOME.x, NPC_HOME.z, 3.5, dt);
    } else {
      // 야간: 모닥불 방어
      npc.target = null; npc.gatherT = 0; npc.task = null; npc.workT = 0;
      let foe = null, bd = NPC_AGGRO;
      for (const e of enemies) {
        if (e.userData.sinking) continue;
        const d = Math.hypot(e.position.x - npc.position.x, e.position.z - npc.position.z);
        if (d < bd) { bd = d; foe = e; }
      }
      if (npc.returning || !foe) {
        if (npcMove(NPC_HOME.x, NPC_HOME.z, 5, dt) < 0.8) npc.returning = false;
      } else {
        state = '전투 중';
        const d = npcMove(foe.position.x, foe.position.z, 5.5, dt);
        if (d < 1.7 && npc.atkCd <= 0) {
          npc.atkCd = 0.8;
          const ang = Math.atan2(foe.position.x - npc.position.x, foe.position.z - npc.position.z);
          spawnSlash(npc.position.x, npc.position.z, ang);
          sectorHit(npc.position.x, npc.position.z, ang);
          if (!enemies.includes(foe)) npc.returning = true;     // 처치했으면 모닥불로 복귀
        }
      }
    }
    npcBody.position.y = NPC_BASE_Y + bob;
    setLabel(state);
  }

  // ---------- 플레이어 공격 ----------
  let atkT = 0, atkCd = 0, shake = 0;
  function attack() {
    if (dead || atkCd > 0) return;
    atkCd = ATK_CD; atkT = SLASH_LIFE; shake = 0.3;
    spawnSlash(player.position.x, player.position.z, facing);
    sectorHit(player.position.x, player.position.z, facing);
  }

  // ---------- 경고 UI / 자원 리스폰 ----------
  const warnEl = document.getElementById('warn');
  let warnTimer;
  function showWarning(msg) {
    warnEl.textContent = msg; warnEl.classList.add('show');
    clearTimeout(warnTimer); warnTimer = setTimeout(() => warnEl.classList.remove('show'), 3000);
  }
  const countType = (t) => obstacles.filter(o => o.userData.type === t).length;
  function respawnResources() {
    const free = (x, z) => Math.hypot(x - player.position.x, z - player.position.z) > 6 &&
                           Math.hypot(x - npc.position.x, z - npc.position.z) > 4;     // 플레이어/동료 근처 제외 (건물은 scatter가 검사)
    const before = obstacles.length;
    scatter(makeTree, Math.max(0, CFG.TREE_COUNT - countType('wood')), free);
    scatter(makeRock, Math.max(0, CFG.STONE_COUNT - countType('stone')), free);
    if (obstacles.length > before) toast('아침이 밝았습니다. 자원이 다시 자라났습니다');
  }
  let lastWarnDay = 0, lastRespawnDay = 1;

  // ---------- 메인 루프 ----------
  const SPEED = 6;
  const buildLblEl = document.getElementById('buildLbl');
  let facing = 0;
  const clock = new THREE.Clock();

  function tick() {
    requestAnimationFrame(tick);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    // 시간 / 조명
    gameMin += dt * MIN_PER_SEC;
    const hour = (gameMin / 60) % 24;
    const night = hour >= 20 || hour < 5;
    const nf = nightFactor(hour);
    applyLighting(nf);
    torch.intensity = nf * 2.4;   // 횃불: 밤에 켜지고 낮에 꺼짐
    const hh = Math.floor(hour), mm = Math.floor(gameMin % 60);
    clockEl.textContent = `Day ${Math.floor(gameMin / 1440) + 1} - ${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;

    const dayNo = Math.floor(gameMin / 1440) + 1;
    const waveDay = hour < 5 ? dayNo - 1 : dayNo;      // 자정이 지나도 같은 밤의 웨이브로 취급
    if (!dead && hour >= 18 && lastWarnDay !== dayNo) { lastWarnDay = dayNo; showWarning(`Night ${dayNo} - 방어전을 준비하십시오!`); }
    if (!dead && hour >= CFG.RESPAWN_HOUR && hour < 18 && lastRespawnDay !== dayNo) { lastRespawnDay = dayNo; respawnResources(); }
    updateEnemies(dt, night, Math.max(1, waveDay));
    updateNpc(dt, hour, t);
    updateFx(dt);
    for (const bp of blueprints) bp.material.opacity = 0.35 + 0.15 * Math.sin(t * 4);
    const lbl = nearestFence('wood') ? '돌 성벽 강화' : '청사진 배치';
    if (buildLblEl.textContent !== lbl) buildLblEl.textContent = lbl;
    animateFire(t);
    atkCd -= dt;
    if (atkT > 0) {
      atkT -= dt;
      capsule.position.z = Math.sin((1 - Math.max(atkT, 0) / SLASH_LIFE) * Math.PI) * 0.35;   // 앞으로 살짝 찌르는 모션
      if (atkT <= 0) capsule.position.z = 0;
    }

    // 입력 합산 (조이스틱 or WASD)
    let ix = joy.x, iy = joy.y;
    const kx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    const ky = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
    if (dead) { ix = iy = 0; }
    else if (kx || ky) { const l = Math.hypot(kx, ky); ix = kx / l; iy = ky / l; }
    const mag = Math.min(1, Math.hypot(ix, iy));

    if (mag > 0.08) {
      // 현재 카메라가 바라보는 방향(수평) 기준으로 전진/우측 벡터 계산
      const fwdX = -Math.sin(yaw), fwdZ = -Math.cos(yaw);
      const rightX = Math.cos(yaw), rightZ = -Math.sin(yaw);
      let mx = rightX * ix + fwdX * iy, mz = rightZ * ix + fwdZ * iy;
      const ml = Math.hypot(mx, mz); mx /= ml; mz /= ml;

      player.position.x += mx * SPEED * mag * dt;
      player.position.z += mz * SPEED * mag * dt;

      // 이동 방향으로 부드럽게 회전
      let diff = Math.atan2(mx, mz) - facing;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      facing += diff * Math.min(1, dt * 14);
      player.rotation.y = facing;
      capsule.position.y = H / 2 + R + Math.abs(Math.sin(t * 12)) * 0.08 * mag;
    } else {
      capsule.position.y += (H / 2 + R - capsule.position.y) * Math.min(1, dt * 10);
    }

    // 충돌 처리: 겹치면 바깥으로 밀어냄
    for (const o of obstacles) {
      const dx = player.position.x - o.position.x, dz = player.position.z - o.position.z;
      const min = o.userData.radius + PLAYER_R, d = Math.hypot(dx, dz);
      if (d < min && d > 1e-4) { player.position.x = o.position.x + dx / d * min; player.position.z = o.position.z + dz / d * min; }
    }
    player.position.x = Math.max(-MAP, Math.min(MAP, player.position.x));
    player.position.z = Math.max(-MAP, Math.min(MAP, player.position.z));

    // 카메라 Lerp 추적
    const k = 1 - Math.exp(-6 * dt);
    camera.position.lerp(goalPos(camGoal), k);
    lookAt.lerp(new THREE.Vector3(player.position.x, LOOK_H, player.position.z), k);
    camera.lookAt(lookAt);

    // 그림자 범위가 플레이어를 따라가게
    sun.target.position.copy(player.position);
    sun.position.set(player.position.x - 20, 16, player.position.z - 12);

    // 카메라 흔들림 (렌더 직전에만 적용)
    let off = null;
    if (shake > 0) {
      off = new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(shake);
      camera.position.add(off);
      shake = Math.max(0, shake - dt * 1.5);
    }
    renderer.render(scene, camera);
    if (off) camera.position.sub(off);
  }
  tick();
})();
</script>
